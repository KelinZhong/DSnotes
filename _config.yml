title: Data Science Interview Prep
author: Kelin Zhong
repository:
  url: https://github.com/KelinZhong/DSnotes
  branch: main

execute:
  execute_notebooks: "force"
  # ds5_modeling's RandomizedSearchCV and MLflow cells run ~10-20s on a fast
  # machine; on the 2-core GitHub runner they can exceed jupyter-book's
  # 30-second default per-cell timeout and kill the build. 300s gives headroom
  # for all training cells (ML5's boosting cells included).
  timeout: 300

  exclude_patterns:
    # These are SNIPPET REFERENCES, not runnable notebooks. Their cells use an
    # undefined `df` / `arr` as a stand-in and read a `data.csv` that does not
    # exist in the repo, so they cannot execute standalone:
    #
    #   DM_Basic          6 of 10 code cells raise
    #   DM_Intermediate   4 of  9
    #   DM_Advanced       8 of 10
    #   Reference_Pandas 11 of 13
    #   Reference_NumPy   3 of 12
    #
    # With allow_errors left at its default (false), the first NameError would
    # abort the entire book build. The handful of self-contained cells in these
    # files ship with stored outputs instead -- do NOT strip those outputs, as
    # they are never regenerated.
    - "Python Data Libs/DM_*.ipynb"
    - "Python Data Libs/Reference_Pandas.ipynb"
    - "Python Data Libs/Reference_NumPy.ipynb"
    - "Metrics/*"
    #
    # Note on Metrics/*: metrics_Python was verified to run cleanly end to end
    # (25/25 code cells, no errors) after being split into real cells, and
    # metrics_SQL has no code cells at all. It is excluded here to match the
    # original configuration and keep the build conservative. If you want live
    # outputs on the metrics chapter, delete the "Metrics/*" line above -- it is
    # the one exclusion that is safe to remove.

html:
  use_repository_button: true
  use_issues_button: true
  home_page_in_navbar: true

sphinx:
  config:
    html_theme: pydata_sphinx_theme
    html_theme_options:
      # 1. Rename the "More" button to "Topics"
      header_dropdown_text: "Topics"

      # 2. Force all top-level chapters into the "Topics" dropdown
      header_links_before_dropdown: 0

      # 3. Keep the sidebar behavior from the original book
      primary_sidebar_end: ["page-toc"]
      secondary_sidebar_items: []

      # 4. Sidebar behavior settings
      collapse_navigation: false
      show_nav_level: 2
      navigation_depth: 4

      # 5. Navbar layout
      navbar_center: ["navbar-nav"] # This ensures the "Topics" button appears
      navbar_end: ["theme-switcher", "navbar-icon-links"]
