title: Data Science Interview Prep
author: Kelin Zhong
repository:
  url: https://github.com/KelinZhong/DSnotes
  branch: main

execute:
  execute_notebooks: "force"
  # ds5_modeling's RandomizedSearchCV and MLflow cells run ~10-20s on a fast
  # machine; on the 2-core GitHub runner they can exceed jupyter-book's
  # 30-second default per-cell timeout and kill the build. 300s gives headroom
  # for all training cells (ML5's boosting cells included).
  timeout: 300
  # Nothing is excluded any more. Previously "Python Data Libs/DM_*",
  # Reference_Pandas, Reference_NumPy and Metrics/* were skipped from
  # execution, but those notebooks carried stored outputs on only 2-3 of their
  # 10-13 code cells -- so the published site rendered the pandas/NumPy drills
  # as code with no results at all. Executing them costs ~1 min of build time
  # and guarantees every cell in the coding-round chapters shows real output.
  allow_errors: false

html:
  use_repository_button: true
  use_issues_button: true
  home_page_in_navbar: true

sphinx:
  config:
    html_theme: pydata_sphinx_theme
    html_theme_options:
      # 1. Rename the "More" button to "Topics"
      header_dropdown_text: "Topics"

      # 2. Force all top-level chapters into the "Topics" dropdown
      header_links_before_dropdown: 0

      # 3. Keep the sidebar behavior from the original book
      primary_sidebar_end: ["page-toc"]
      secondary_sidebar_items: []

      # 4. Sidebar behavior settings
      collapse_navigation: false
      show_nav_level: 2
      navigation_depth: 4

      # 5. Navbar layout
      navbar_center: ["navbar-nav"] # This ensures the "Topics" button appears
      navbar_end: ["theme-switcher", "navbar-icon-links"]
